# Analyse statique : https://dart.dev/tools/analysis
# Base recommandée Flutter (déjà adaptée aux apps).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
  # Imports / code mort : remonter les hints analyseur (Phase 7 — nettoyage optionnel)
  errors:
    unused_import: warning
    unused_element: warning
    unused_field: warning
    unused_local_variable: warning
    dead_code: warning
  # Durcissement possible plus tard (beaucoup d’impacts sur une grosse base) :
  # language:
  #   strict-casts: true
  #   strict-inference: true

linter:
  rules:
    # --- flutter_lints couvre déjà : avoid_print, prefer_const_constructors (partiel), etc. ---

    # Douceur n°1 : appels `super.x` plus compacts (surtout sur le nouveau code)
    use_super_parameters: true

    # À activer par étapes (souvent des milliers d’infos au premier passage) :
    # prefer_const_constructors: true
    # prefer_const_declarations: true
    # prefer_final_locals: true
    # directives_ordering: true
    # always_declare_return_types: true

# Suppression locale : // ignore: rule_name ou // ignore_for_file: rule_name
